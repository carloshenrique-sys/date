<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlixDate - Sexta-feira</title>
    <style>
        /* Estilos base da página */
        body { 
            background-color: #141414; 
            color: white; 
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; 
            margin: 0; 
            overflow-x: hidden; 
        }
        .logo { 
            color: #E50914; 
            font-size: 2rem; 
            font-weight: bold; 
            margin: 20px; 
            text-transform: uppercase; 
            letter-spacing: 2px; 
        }

        /* Tela 1: Seleção de Perfil */
        #screen1 { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 70vh; 
        }
        h1 { 
            font-size: 2.2rem; 
            margin-bottom: 40px; 
            text-align: center; 
            font-weight: 500;
        }
        .profile { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            cursor: pointer; 
            transition: transform 0.2s; 
        }
        .profile:hover { 
            transform: scale(1.1); 
        }
        .profile img { 
            width: 150px; 
            height: 150px; 
            border-radius: 10px; 
            border: 3px solid transparent; 
            object-fit: cover;
        }
        .profile:hover img { 
            border-color: white; 
        }
        .profile span { 
            margin-top: 15px; 
            font-size: 1.3rem; 
            color: gray; 
        }
        .profile:hover span { 
            color: white; 
        }

        /* Tela 2: Detalhes do Date no Sushi */
        #screen2 { 
            display: none; 
            padding: 20px; 
            max-width: 1000px; 
            margin: auto; 
            animation: fadeIn 1s;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .hero { 
            position: relative; 
            height: 65vh; 
            background: linear-gradient(to top, #141414 5%, rgba(20,20,20,0.4)), url('https://images.unsplash.com/photo-1579871494447-9811cf80d66c?q=80&w=1000') center/cover; 
            border-radius: 10px; 
            display: flex; 
            flex-direction: column; 
            justify-content: flex-end; 
            padding: 40px; 
        }
        .title { 
            font-size: 4rem; 
            margin: 0 0 10px 0; 
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8); 
        }
        .info { 
            display: flex; 
            gap: 15px; 
            color: #a3a3a3; 
            font-weight: bold; 
            margin-bottom: 20px; 
            font-size: 1.1rem;
        }
        .match { 
            color: #46d369; 
        }
        .synopsis { 
            font-size: 1.3rem; 
            max-width: 600px; 
            margin-bottom: 30px; 
            line-height: 1.5; 
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8); 
        }
        .btn-play { 
            background-color: white; 
            color: black; 
            font-weight: bold; 
            font-size: 1.3rem; 
            padding: 12px 30px; 
            border: none; 
            border-radius: 4px; 
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            gap: 10px; 
            transition: background 0.2s; 
            width: fit-content;
        }
        .btn-play:hover { 
            background-color: rgba(255,255,255,0.7); 
        }
    </style>
</head>
<body>

    <div class="logo">FlixDate</div>

    <!-- TELA 1: Quem está assistindo? -->
    <div id="screen1">
        <h1>Quem vai sair comigo na sexta?</h1>
        <div class="profile" onclick="selecionarPerfil()">
            <!-- Puxando a foto local referenciada -->
            <img src="image_176748.jpg" alt="A mais gata">
            <span>A mais gata</span>
        </div>
    </div>

    <!-- TELA 2: O Date (Sushi) -->
    <div id="screen2">
        <div class="hero">
            <h2 class="title">Sexta no Sushi 🍣</h2>
            <div class="info">
                <span class="match">99% Relevante</span>
                <span>2026</span>
                <span>Episódio 1</span>
            </div>
            <p class="synopsis">Um date incrível estrelado por nós dois. Prepare-se para uma noite de muita risada, shoyu, os melhores rolls da cidade e muitos beijinhos.</p>
            
            <button class="btn-play" onclick="confirmarDate()">
                ▶ Assistir (Confirmar)
            </button>
        </div>
    </div>

    <script>
        // Função para esconder a tela de perfis e mostrar a tela do date
        function selecionarPerfil() {
            document.getElementById('screen1').style.display = 'none';
            document.getElementById('screen2').style.display = 'block';
        }

        // Função para redirecionar para o WhatsApp
        function confirmarDate() {
            var telefone = "5579988410626";
            
            // Usando códigos Unicode para os emojis (100% imune a erros de codificação)
            // \uD83E\uDD62 = Hashi
            // \u2764\uFE0F = Coração Vermelho
            var mensagem = "Oii! Pode preparar o hashi \uD83E\uDD62, está confirmado o date na sexta\u2764\uFE0F";
            
            var url = "https://wa.me/" + telefone + "?text=" + encodeURIComponent(mensagem);
            
            window.location.href = url;
        }
    </script>

</body>
</html>
